<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Smartphone / POS Device Symbol -->
  <g transform="translate(106, 96)">
    <!-- Phone Body -->
    <rect x="20" y="10" width="260" height="300" rx="36" fill="#08111e" stroke="#ffffff" stroke-width="12" />
    
    <!-- Phone Screen -->
    <rect x="36" y="36" width="228" height="230" rx="18" fill="#0c182c" />
    
    <!-- Cash Register / Lightning Icon inside Screen -->
    <!-- Signal Waves -->
    <path d="M 90 70 A 40 40 0 0 1 210 70" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <path d="M 115 95 A 20 20 0 0 1 185 95" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" />
    <circle cx="150" cy="115" r="8" fill="#38bdf8" />

    <!-- Lightning Bolt / Fast POS -->
    <path d="M 160 140 L 125 190 L 150 190 L 135 240 L 180 180 L 155 180 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />

    <!-- Home Button / Fingerprint Dot -->
    <circle cx="150" cy="285" r="10" fill="#ffffff" />
  </g>
</svg>
